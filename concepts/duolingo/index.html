<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pesadithi · Guess Amani's year</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2B2F38; --muted:#6B7280; --line:#E6E8EC; --bg:#FFFFFF; --sky:#EEF8FF;
  --blue:#1CB0F6; --blue-d:#1497D4; --blue-l:#DDF4FF;
  --in:#58CC02; --in-d:#46A302; --in-l:#E7F9D6;
  --out:#FF4B4B; --out-d:#E03535; --out-l:#FFE3E3;
  --borrow:#8E4DF0; --borrow-d:#7337D3; --borrow-l:#EFE4FF;
  --sun:#FFC800; --sun-d:#E8A500; --sun-l:#FFF6CC;
  --orange:#FF9600; --orange-l:#FFF0DC;
  --r:18px;
  --display:'Fredoka', 'Nunito', system-ui, sans-serif;
  --body:'Nunito', system-ui, sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:var(--body);font-weight:700;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:1fr;height:100dvh}
.lesson{display:flex;flex-direction:column;height:100dvh;min-width:0;position:relative}
.side{display:none}
@media (min-width:1000px){
  .app{grid-template-columns:1fr 360px;max-width:1180px;margin:0 auto;gap:40px;padding:0 32px}
  .side{display:flex;flex-direction:column;gap:16px;padding:28px 0;overflow:auto}
}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:14px;padding:16px 18px 8px;max-width:720px;width:100%;margin:0 auto}
.icon-btn{border:0;background:none;padding:6px;border-radius:12px;color:#AFB4BC;display:grid;place-items:center}
.icon-btn:hover{background:#F3F4F6}
.icon-btn:focus-visible,.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.cell:focus-visible,.step:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.bar{flex:1;height:16px;background:#E9EBEF;border-radius:99px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;width:0;background:var(--sun);border-radius:99px;transition:width .6s cubic-bezier(.3,1.4,.5,1);position:relative}
.bar i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:9px;background:rgba(255,255,255,.45)}
.pill{display:flex;align-items:center;gap:5px;font-family:var(--display);font-weight:700;font-size:18px}
.pill.flame{color:var(--orange)}
.pill.gem{color:var(--blue)}
.pill.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.35)}60%{transform:scale(.92)}}

/* ---------- stage ---------- */
.stage{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 20px 24px;width:100%;max-width:720px;margin:0 auto;scroll-behavior:smooth}
.screen{animation:slideIn .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.kicker{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--borrow);display:flex;align-items:center;gap:8px;margin:10px 0 6px}
.kicker .lvl{background:var(--borrow-l);padding:3px 10px;border-radius:99px}
.kicker.boss{color:var(--orange)} .kicker.boss .lvl{background:var(--orange-l)}
h1,h2{font-family:var(--display);font-weight:700;letter-spacing:-.01em;margin:0}
h2.q{font-size:26px;line-height:1.18;margin:4px 0 14px}
@media (min-width:600px){h2.q{font-size:30px}}

/* mascot + bubble */
.talk{display:flex;align-items:flex-end;gap:10px;margin:6px 0 18px}
.dithi{width:76px;height:76px;flex:none}
.dithi svg{width:100%;height:100%;overflow:visible}
.dithi.hop svg{animation:hop .7s cubic-bezier(.3,1.6,.5,1)}
.dithi.shake svg{animation:shake .5s}
.dithi.idle svg{animation:breathe 3s ease-in-out infinite}
@keyframes hop{30%{transform:translateY(-18px) rotate(-6deg)}60%{transform:translateY(0) scale(1.06,.94)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes breathe{50%{transform:translateY(-3px)}}
.bubble{position:relative;border:2px solid var(--line);border-radius:16px;padding:11px 14px;font-size:16px;line-height:1.35;background:#fff;max-width:440px}
.bubble::before{content:"";position:absolute;left:-10px;bottom:16px;width:16px;height:16px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}

/* ---------- buttons ---------- */
.btn{border:0;border-radius:16px;padding:15px 22px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.04em;text-transform:uppercase;width:100%;
  background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--blue-d);transition:transform .08s,box-shadow .08s,filter .2s}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 var(--blue-d)}
.btn:disabled{background:#E5E7EB;color:#AFB4BC;box-shadow:0 5px 0 #D5D8DD;cursor:default}
.btn:disabled:active{transform:none}
.btn.ghost{background:#fff;color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.sun{background:var(--sun);color:#5B4300;box-shadow:0 5px 0 var(--sun-d)}
.btn.orange{background:var(--orange);box-shadow:0 5px 0 #D97F00}
.btn.purple{background:var(--borrow);box-shadow:0 5px 0 var(--borrow-d)}

/* options */
.opts{display:grid;gap:12px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);border-radius:16px;padding:14px 14px;background:#fff;box-shadow:0 4px 0 var(--line);font-size:17px;font-weight:800;transition:transform .08s, box-shadow .08s, background .15s,border-color .15s}
.opt:active{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.opt .k{flex:none;width:30px;height:30px;border:2px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:14px;color:#9CA3AF}
.opt small{display:block;font-weight:700;color:var(--muted);font-size:13px;margin-top:2px}
.opt[aria-pressed="true"]{border-color:#84D8FF;background:var(--blue-l);box-shadow:0 4px 0 #84D8FF;color:var(--blue-d)}
.opt[aria-pressed="true"] .k{border-color:#84D8FF;color:var(--blue-d)}
.opt.big{flex-direction:column;justify-content:center;text-align:center;padding:20px 10px;gap:8px;font-family:var(--display);font-size:20px}
.opt.big .em{font-size:40px;line-height:1}
.opt.right{border-color:var(--blue);background:var(--blue-l);box-shadow:0 4px 0 var(--blue)}
.opt.wrong{border-color:#FFB4A8;background:#FFF1EC;box-shadow:0 4px 0 #FFB4A8;opacity:.8}
.opts.locked .opt{pointer-events:none}

/* slider */
.boss-q .guess{border-color:#FFD29C;box-shadow:0 4px 0 #FFD29C}
.guess{border:2px solid var(--line);border-radius:22px;padding:18px 18px 22px;box-shadow:0 4px 0 var(--line)}
.readout{text-align:center;font-family:var(--display);font-weight:700;font-size:58px;line-height:1;color:var(--blue);margin:4px 0 2px;font-variant-numeric:tabular-nums}
.readout.idle{color:#C9CDD3}
.unit{text-align:center;color:var(--muted);font-size:15px;margin-bottom:16px}
.srow{display:flex;align-items:center;gap:12px}
.step{flex:none;width:46px;height:46px;border-radius:14px;border:2px solid var(--line);background:#fff;box-shadow:0 3px 0 var(--line);font-family:var(--display);font-size:24px;color:var(--blue);display:grid;place-items:center}
.step:active{transform:translateY(3px);box-shadow:none}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:16px;border-radius:99px;background:linear-gradient(90deg,var(--blue) var(--p,50%),#E9EBEF var(--p,50%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid var(--blue);box-shadow:0 3px 0 var(--blue-d);cursor:grab}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--blue);box-shadow:0 3px 0 var(--blue-d);cursor:grab}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:3px solid var(--sun);outline-offset:2px}
.ends{display:flex;justify-content:space-between;color:#9CA3AF;font-size:13px;margin-top:8px;padding:0 58px}

/* chips + calendar */
.chips{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.chip{border:2px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 4px 0 var(--line);padding:14px 0;font-family:var(--display);font-weight:700;font-size:18px}
.chip[aria-pressed="true"]{border-color:#84D8FF;background:var(--blue-l);color:var(--blue-d);box-shadow:0 4px 0 #84D8FF}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.cell{aspect-ratio:1;border:2px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 3px 0 var(--line);font-family:var(--display);font-weight:600;font-size:16px;display:grid;place-items:center;position:relative;padding:0}
.cell[aria-pressed="true"]{border-color:#84D8FF;background:var(--blue-l);color:var(--blue-d);box-shadow:0 3px 0 #84D8FF}
.cal.locked .cell{pointer-events:none}

/* ---------- reveal ---------- */
.reveal{margin-top:20px;border-radius:22px;background:var(--sky);padding:18px;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}}
.reveal h3{font-family:var(--display);font-size:20px;margin:0 0 6px}
.reveal p{margin:6px 0;font-size:16px;line-height:1.45;font-weight:700;color:#3F4652}
.big-n{font-family:var(--display);font-weight:700;font-size:clamp(44px,13vw,64px);line-height:1;margin:2px 0;white-space:nowrap;font-variant-numeric:tabular-nums}
.meter{position:relative;height:84px;margin:2px 10px 12px}
.meter .tr{position:absolute;left:0;right:0;top:37px;height:10px;border-radius:99px;background:#fff}
.meter .gap{position:absolute;top:37px;height:10px;border-radius:99px;background:repeating-linear-gradient(90deg,#BFE6FB 0 6px,transparent 6px 10px)}
.meter .pin{position:absolute;top:0;transform:translateX(calc(var(--x,50) * -1%));display:flex;flex-direction:column;align-items:center;gap:3px;transition:left 1s cubic-bezier(.2,1.2,.4,1)}
.meter .pin span{font-family:var(--display);font-size:13px;padding:3px 9px;border-radius:99px;color:#fff;white-space:nowrap}
.meter .pin i{width:22px;height:22px;border-radius:50%;border:4px solid #fff;margin-top:0;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.meter .you span,.meter .you i{background:var(--blue)} .meter .real span,.meter .real i{background:var(--ink)}
.meter .real{top:31px} .meter .real span{order:2;margin-top:2px} .meter .real i{order:1;margin-top:0}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:#fff;border-radius:16px;padding:12px;border:2px solid var(--line)}
.tile b{display:block;font-family:var(--display);font-size:22px;line-height:1.1}
.tile span{font-size:13px;color:var(--muted)}
.c-in{color:var(--in-d)} .c-out{color:var(--out-d)} .c-b{color:var(--borrow)} .c-blue{color:var(--blue-d)}
.vs{display:grid;gap:10px;margin:8px 0}
.vs .row{display:grid;grid-template-columns:42px 1fr;align-items:center;gap:10px;font-size:14px}
.vs .track{height:34px;border-radius:12px;background:#fff;overflow:hidden}
.vs .fill{height:100%;border-radius:12px;display:flex;align-items:center;padding:0 12px;color:#fff;font-family:var(--display);font-size:17px;white-space:nowrap;width:0;transition:width 1s cubic-bezier(.2,.9,.3,1)}
.months{display:grid;gap:5px;margin:12px 0 6px}
.mrow{display:grid;grid-template-columns:34px 1fr 26px;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dots{display:grid;grid-template-columns:repeat(31,1fr);gap:2px}
.dots i{aspect-ratio:1;border-radius:3px;background:#DCE3EA}
.dots i.none{background:transparent}
.dots i.on{background:var(--borrow);transform:scale(0);animation:dot .35s forwards}
@keyframes dot{to{transform:scale(1)}}
.mrow b{font-family:var(--display);color:var(--borrow);text-align:right}
.mrow b.z{color:#C3C8CF}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.hbars{display:grid;gap:8px;margin-top:10px}
.hb{display:grid;grid-template-columns:1fr;gap:3px;font-size:14px}
.hb .lab{display:flex;justify-content:space-between;gap:10px}.hb .lab span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb .lab b{white-space:nowrap}
.hb .t{height:14px;border-radius:99px;background:#fff;overflow:hidden}
.hb .t i{display:block;height:100%;border-radius:99px;background:var(--out);width:0;transition:width .9s cubic-bezier(.2,.9,.3,1)}
.hb.me .lab{color:var(--blue-d)}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.list{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.list li{background:#fff;border-radius:14px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;font-size:14px;border:2px solid var(--line)}
.list li b{font-family:var(--display);white-space:nowrap}
.sms{font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:600;background:#fff;border-radius:14px;border:2px dashed #D6DBE1;padding:10px 12px;color:#4B5563;margin-top:10px;line-height:1.45}

/* ---------- footer / feedback ---------- */
.foot{border-top:2px solid var(--line);background:#fff;padding:14px 20px calc(16px + env(safe-area-inset-bottom));transition:background .25s}
.foot .inner{max-width:720px;margin:0 auto;display:grid;gap:12px}
.fb{display:none;align-items:center;gap:12px}
.fb .badge{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#fff;font-size:24px;flex:none}
.fb strong{font-family:var(--display);font-size:22px;display:block;line-height:1.1}
.fb span{font-size:15px}
.foot.perfect{background:var(--blue-l);border-color:transparent}
.foot.perfect .fb{display:flex;color:var(--blue-d)}
.foot.close{background:var(--sun-l);border-color:transparent}
.foot.close .fb{display:flex;color:#8A6400}
.foot.miss{background:var(--orange-l);border-color:transparent}
.foot.miss .fb{display:flex;color:#B35F00}
.foot.perfect .btn{background:var(--blue)}
.foot.close .btn{background:var(--sun);color:#5B4300;box-shadow:0 5px 0 var(--sun-d)}
.foot.miss .btn{background:var(--orange);box-shadow:0 5px 0 #D97F00}
.xpfly{position:fixed;font-family:var(--display);font-weight:700;font-size:22px;color:var(--blue);pointer-events:none;animation:fly 1.1s ease-out forwards;z-index:30}
@keyframes fly{from{opacity:1;transform:translateY(0) scale(.8)}to{opacity:0;transform:translateY(-70px) scale(1.2)}}

/* ---------- intro ---------- */
.intro{text-align:center;padding-top:10px}
.intro .dithi{width:118px;height:118px;margin:6px auto 0}
.intro .path{transform:scale(.82);transform-origin:top center;margin-bottom:-60px}
.intro h1{font-size:36px;line-height:1.05;margin:12px 0 8px}
.intro h1 em{font-style:normal;color:var(--blue)}
.intro p.lead{font-size:17px;color:#4B5563;max-width:400px;margin:0 auto 18px;line-height:1.45}
.path{position:relative;margin:8px auto 10px;width:260px;display:grid;gap:8px}
.node{width:56px;height:50px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:#fff;background:#E5E7EB;box-shadow:0 6px 0 #CDD1D6;margin:0 auto;position:relative}
.node.cur{background:var(--blue);box-shadow:0 6px 0 var(--blue-d)}
.node.cur::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid #BDE8FD;animation:ring 1.8s ease-in-out infinite}
@keyframes ring{50%{transform:scale(1.08);opacity:.6}}
.node.done{background:var(--sun);box-shadow:0 6px 0 var(--sun-d);color:#5B4300}
.node.boss{background:#FFE1BD;box-shadow:0 6px 0 #F5C48A}
.node svg{width:26px;height:26px}
.demo{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#6B7280;background:#F3F4F6;border-radius:99px;padding:5px 11px;margin:4px 0}
.credit{font-size:12.5px;color:#9CA3AF;text-align:center;margin-top:14px}
.credit a{color:inherit}

/* ---------- end ---------- */
.end{text-align:center}
.trophy{font-family:var(--display);font-size:30px;margin:6px 0 2px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.st{border:2px solid;border-radius:16px;overflow:hidden}
.st .h{font-family:var(--display);font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:#fff;padding:5px 0}
.st .v{font-family:var(--display);font-size:24px;padding:10px 0;background:#fff}
.st.a{border-color:var(--sun);} .st.a .h{background:var(--sun);color:#5B4300} .st.a .v{color:#B88500}
.st.b{border-color:var(--blue)} .st.b .h{background:var(--blue)} .st.b .v{color:var(--blue-d)}
.st.c{border-color:var(--orange)} .st.c .h{background:var(--orange)} .st.c .v{color:#D97F00}
.card{position:relative;margin:8px auto 16px;max-width:360px;border-radius:28px;padding:22px 20px 18px;text-align:left;color:#fff;overflow:hidden;
  background:linear-gradient(160deg,#1CB0F6 0%,#4B7BF5 52%,#8E4DF0 100%);box-shadow:0 8px 0 #5B3DC2}
.card .brand{font-family:var(--display);font-size:15px;opacity:.9;display:flex;justify-content:space-between}
.card h3{font-family:var(--display);font-size:27px;line-height:1.05;margin:10px 0 14px;padding-right:70px}
.card .stk{position:absolute;right:14px;top:36px;width:78px;height:78px;transform:rotate(10deg)}
.card .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card .g{background:rgba(255,255,255,.16);border-radius:16px;padding:10px 12px}
.card .g b small{font-size:12px;opacity:.85;margin-right:3px}
.card .g b{font-family:var(--display);font-size:20px;display:block;line-height:1.1;white-space:nowrap}
.card .g span{font-size:12.5px;opacity:.92}
.card .g.wide{grid-column:span 2;display:flex;align-items:center;gap:12px}
.card .foot2{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12.5px;opacity:.95}
.card .score{background:var(--sun);color:#5B4300;border-radius:99px;padding:4px 11px;font-family:var(--display);font-size:14px;white-space:nowrap;flex:none}
.card .foot2{gap:10px}
.card .sp{position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12)}
.actions{display:grid;gap:12px;max-width:360px;margin:0 auto}
.toast{position:fixed;left:50%;top:64px;transform:translateX(-50%) translateY(-14px);background:var(--ink);color:#fff;border-radius:14px;padding:10px 16px;font-size:15px;opacity:0;transition:.3s;pointer-events:none;z-index:40}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ---------- side panel (desktop) ---------- */
.panel{border:2px solid var(--line);border-radius:20px;padding:18px}
.panel h4{font-family:var(--display);font-size:19px;margin:0 0 10px}
.panel .row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:15px}
.panel .row + .row{border-top:2px solid #F1F2F4}
.panel .row b{font-family:var(--display);font-size:20px}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.plist li{display:flex;gap:10px;align-items:center;font-size:14.5px;color:#9CA3AF}
.plist li i{width:24px;height:24px;border-radius:50%;background:#E5E7EB;flex:none;display:grid;place-items:center;font-style:normal;font-size:12px;color:#fff;font-family:var(--display)}
.plist li.done{color:var(--ink)} .plist li.done i{background:var(--sun);color:#5B4300}
.plist li.cur{color:var(--blue-d)} .plist li.cur i{background:var(--blue)}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:20}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .dots i.on{transform:none}
}
</style>
</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>
<div class="app">
  <main class="lesson">

/* ---- charts ---- */
function drainChart(guess){
  const W=330,H=170,pl=34,pr=10,pt=12,pb=26, x=d=>pl+(d/30)*(W-pl-pr), y=v=>pt+(1-v)*(H-pt-pb);
  const pts = D.drain.map(p=>`${x(p.day).toFixed(1)},${y(p.remaining).toFixed(1)}`).join(' ');
  const hl = D.halfLifeDays, tq = D.threeQuarterDays;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Share of payday money left by days since payday. Half is gone by day ${hl}, three quarters by day ${tq}.">
    ${[0,.5,1].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#D6E6F2" stroke-width="2" stroke-dasharray="${v===.5?'5 5':''}"/><text x="${pl-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="#6B7280">${v*100}%</text>`).join('')}
    <polygon points="${x(0)},${y(0)} ${pts} ${x(30)},${y(0)}" fill="#FF4B4B" opacity=".14"/>
    <polyline points="${pts}" fill="none" stroke="#FF4B4B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="${x(hl)}" x2="${x(hl)}" y1="${y(.5)}" y2="${y(0)}" stroke="#E03535" stroke-width="2.5"/>
    <circle cx="${x(hl)}" cy="${y(.5)}" r="7" fill="#fff" stroke="#E03535" stroke-width="4"/>
    <text x="${x(hl)+10}" y="${y(.5)-10}" font-size="13" font-weight="800" fill="#E03535">day ${hl}</text>
    ${guess!=null?`<line x1="${x(guess)}" x2="${x(guess)}" y1="${pt}" y2="${y(0)}" stroke="#1CB0F6" stroke-width="3" stroke-dasharray="4 4"/><text x="${Math.min(x(guess)+6,W-60)}" y="${pt+12}" font-size="12" font-weight="800" fill="#1497D4">your guess</text>`:''}
    ${[0,7,14,21,28].map(d=>`<text x="${x(d)}" y="${H-6}" font-size="11" text-anchor="middle" fill="#6B7280">${d===0?'payday':'+'+d}</text>`).join('')}
  </svg>`;
}
function fulizaMonths(){
  const byMonth = {};
  D.daily.forEach(d => { const k=d.date.slice(0,7); (byMonth[k] ||= []).push(d); });
  let delay=0;
  return `<div class="months" role="img" aria-label="Calendar of the year. Purple squares mark the ${fz.daysOwing} days that ended owing Fuliza: ${D.months.map(m=>MON[+m.month.slice(5)-1]+' '+m.daysOwingFuliza).join(', ')}.">` +
    D.months.map(m => {
      const days = byMonth[m.month] || [];
      const first = days.length ? +days[0].date.slice(8) : 1;
      let cells = '';
      for (let i=1;i<first;i++) cells += '<i class="none"></i>';
      days.forEach(d => { if (d.fulizaOwed>0){ cells += `<i class="on" style="animation-delay:${(delay+=28)}ms"></i>`; } else cells += '<i></i>'; });
      const n = m.daysOwingFuliza;
      return `<div class="mrow"><span>${MON[+m.month.slice(5)-1]}${m.month.endsWith('-01')||m.month==='2025-11'?' '+m.month.slice(2,4):''}</span><div class="dots">${cells}</div><b class="${n?'':'z'}">${n}</b></div>`;
    }).join('') + '</div>';
}
function hbars(rows, key, me, label, color){
  const max = Math.max(...rows.map(r=>r[key]));
  return `<div class="hbars">${rows.map(r=>`<div class="hb ${r===me?'me':''}"><div class="lab"><span>${label(r)}</span><b>${r===me?'★ ':''}${key==='total'?kes(r[key]):fmt(r[key])}</b></div><div class="t"><i data-w="${(r[key]/max*100).toFixed(1)}" style="background:${color}"></i></div></div>`).join('')}</div>`;
}
function weekBars(sel){
  const max = Math.max(...wkCount), W=330,H=150,bw=34,gap=(W-7*bw)/6;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Transactions by weekday: ${DAYS.map((d,i)=>d+' '+wkCount[i]).join(', ')}.">${wkCount.map((c,i)=>{
    const h=(c/max)*(H-44), x=i*(bw+gap), y=H-22-h, pk=i===peakDay;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="9" fill="${pk?'#FF4B4B':'#FFC2C2'}"/>
      <text x="${x+bw/2}" y="${y-6}" font-size="12" font-weight="800" text-anchor="middle" fill="${pk?'#E03535':'#6B7280'}">${c}</text>
      <text x="${x+bw/2}" y="${H-5}" font-size="12" font-weight="800" text-anchor="middle" fill="${i===sel?'#1497D4':'#6B7280'}">${DAYS[i]}${i===sel?' •':''}</text>`;}).join('')}</svg>`;
}
function domCal(sel){
  const max = Math.max(...D.dayOfMonth.map(d=>d.fulizaDrawn));
  return `<div class="cal locked" role="img" aria-label="Days of the month shaded by Fuliza borrowed. Lowest balance on the ${D.lowestBalanceDayOfMonth}th; the main pay lands on the 26th.">${D.dayOfMonth.map(d=>{
    const a = d.fulizaDrawn/max, low = d.day===D.lowestBalanceDayOfMonth, pay = d.day===D.bigInflowDays[0];
    const bg = pay ? 'var(--in)' : a>0 ? `rgba(142,77,240,${0.15+a*0.75})` : '#fff';
    const col = pay ? '#fff' : a>0.5 ? '#fff' : 'var(--ink)';
    return `<div class="cell" style="background:${bg};color:${col};${low?'border-color:#2B2F38;border-width:3px;':''}${d.day===sel?'outline:3px dashed var(--blue);outline-offset:2px;':''}">${d.day}</div>`;}).join('')}</div>
  <div class="legend"><span><i style="background:var(--borrow)"></i>Fuliza borrowed</span><span><i style="background:var(--in)"></i>Payday</span><span><i style="border:2px solid #2B2F38"></i>Thinnest</span></div>`;
}

function title(s){ return s.toLowerCase().replace(/\b([a-z])/g,c=>c.toUpperCase()).replace(/\bKfc\b/,'KFC').replace(/\bCjs\b/,"CJ's").replace(/\bSt\b/,'St'); }
function shortDate(iso){ const [y,m,d]=iso.split('-'); return `${+d} ${MON[+m-1]}`; }

/* ---- state ---- */
const S = { i:-1, xp:0, streak:0, best:0, spot:0, results:[], val:null, phase:'ask' };
const stage=$('#stage'), foot=$('#foot'), btn=$('#mainBtn');

function setStats(bumpXp, bumpStreak){
  $('#xp').textContent=S.xp; $('#streak').textContent=S.streak;
  $('#sXp').textContent=S.xp; $('#sStreak').textContent=S.streak; $('#sSpot').textContent=S.spot;
  if(bumpXp){ const p=$('#xpPill'); p.classList.remove('bump'); void p.offsetWidth; p.classList.add('bump'); }
  if(bumpStreak){ const p=$('#streakPill'); p.classList.remove('bump'); void p.offsetWidth; p.classList.add('bump'); }
  const done = S.results.length;
  $('#barFill').style.width = (done/L.length*100)+'%';
  $('#bar').setAttribute('aria-valuenow', done);
  $('#plist').innerHTML = L.map((l,i)=>`<li class="${i<done?'done':i===S.i&&S.i>=0?'cur':''}"><i>${i<done?'✓':i+1}</i>${l.kicker}: ${l.title}</li>`).join('');
}

/* ---- intro ---- */
function intro(){
  S.i=-1; S.xp=0; S.streak=0; S.best=0; S.spot=0; S.results=[];
  $('#top').hidden=true; foot.hidden=false; foot.className='foot'; btn.disabled=false; btn.textContent='Start the run'; S.phase='intro';
  const offs=[0,-50,-80,-50,0,50,80,50,0];
  stage.innerHTML = `<div class="screen intro">
    <div class="demo">Invented demo data · fictional person</div>
    <div class="dithi idle">${dithi('happy')}</div>
    <h1>Can you guess <em>Amani's</em> year in money?</h1>
    <p class="lead">Nine quick rounds from a year of mobile money in Nairobi. Guess first, then see what really happened.</p>
    <div class="path" aria-hidden="true">${L.map((l,i)=>`<div class="node ${i===0?'cur':''} ${l.boss?'boss':''}" style="transform:translateX(${offs[i]}px)">${l.boss?'<svg viewBox="0 0 24 24"><path d="M4 19h16l-1.5-10-4.5 4-2-7-2 7-4.5-4z" fill="#FF9600"/></svg>':i===0?'<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="#fff"/></svg>':'<svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z" fill="#C3C8CF"/></svg>'}</div>`).join('')}</div>
    <p class="credit">Pesadithi · made by Mark Kaigwa · <a href="https://mark.co.ke" target="_blank" rel="noopener">mark.co.ke</a></p>
  </div>`;
  btn.focus({preventScroll:true});
  setStats();
}

/* ---- question ---- */
function next(){
  S.i++; S.val=null; S.phase='ask';
  if(S.i>=L.length) return end();
  const l=L[S.i];
  foot.className='foot'; btn.textContent='Check'; btn.disabled=true;
  let input='';
  if(l.type==='big') input=`<div class="opts two" role="group" aria-label="Answers">${l.options.map((o,k)=>`<button class="opt big" data-v="${o.id}" aria-pressed="false"><span class="em" aria-hidden="true">${o.em}</span>${o.t}</button>`).join('')}</div>`;
  if(l.type==='choice') input=`<div class="opts" role="group" aria-label="Answers">${l.options.map((o,k)=>`<button class="opt" data-v="${o.id}" aria-pressed="false"><span class="k" aria-hidden="true">${k+1}</span><span>${o.t}</span></button>`).join('')}</div>`;
  if(l.type==='slider') input=`<div class="guess">
      <div class="readout idle" id="ro">${l.money?'KES ':''}${fmt(l.start)}</div><div class="unit" id="unit">${l.unit(l.start)}</div>
      <div class="srow"><button class="step" data-d="-1" aria-label="Less">−</button>
      <input type="range" id="rng" min="${l.min}" max="${l.max}" step="${l.step}" value="${l.start}" aria-label="Your guess" aria-valuetext="${fmt(l.start)} ${l.unit(l.start)}">
      <button class="step" data-d="1" aria-label="More">+</button></div>
      <div class="ends"><span>${l.money?'KES ':''}${fmt(l.min)}</span><span>${l.money?'KES ':''}${fmt(l.max)}</span></div></div>`;
  if(l.type==='week') input=`<div class="chips" role="group" aria-label="Weekdays">${DAYS.map((d,i)=>`<button class="chip" data-v="${i}" aria-pressed="false"><span aria-hidden="true">${d.slice(0,2)}</span><span class="sr">${d}</span></button>`).join('')}</div>`;
  if(l.type==='cal') input=`<div class="cal" role="group" aria-label="Days of the month">${D.dayOfMonth.map(d=>`<button class="cell" data-v="${d.day}" aria-pressed="false" aria-label="Day ${d.day}">${d.day}</button>`).join('')}</div>`;
  stage.innerHTML=`<div class="screen ${l.boss?'boss-q':''}">
    <div class="kicker ${l.boss?'boss':''}"><span class="lvl">${l.kicker}</span>${l.title}</div>
    <div class="talk"><div class="dithi idle" id="dz">${dithi(l.mood)}</div><div class="bubble">${l.say}</div></div>
    <h2 class="q">${l.q}</h2>${input}<div id="rv"></div></div>`;
  stage.scrollTop=0;
  wire(l);
  setStats();
}
function wire(l){
  stage.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{
    if(S.phase!=='ask') return;
    stage.querySelectorAll('[data-v]').forEach(x=>x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true');
    S.val = isNaN(+b.dataset.v) || l.type==='choice' || l.type==='big' ? b.dataset.v : +b.dataset.v;
    btn.disabled=false;
  });
  const r=$('#rng'); if(!r) return;
  const upd=(touch=true)=>{ const v=+r.value; $('#ro').textContent=(l.money?'KES ':'')+fmt(v); $('#unit').textContent=l.unit(v);
    r.style.setProperty('--p', ((v-l.min)/(l.max-l.min)*100)+'%'); r.setAttribute('aria-valuetext', fmt(v)+' '+l.unit(v));
    if(touch){ S.val=v; btn.disabled=false; $('#ro').classList.remove('idle'); } };
  r.oninput=()=>upd(); upd(false);
  stage.querySelectorAll('.step').forEach(s=>s.onclick=()=>{ if(S.phase!=='ask')return; r.value=+r.value + (+s.dataset.d)*l.step*(l.money?5:1); upd(); });
}

function check(){
  const l=L[S.i]; const g=S.val;
  let tier = l.judge ? l.judge(g) : (g===l.answer?'perfect':'miss');
  S.phase='shown';
  const gain = {perfect:20, close:10, miss:5}[tier];
  S.xp+=gain; if(tier!=='miss'){ S.streak++; S.best=Math.max(S.best,S.streak);} else S.streak=0;
  if(tier==='perfect') S.spot++;
  S.results.push({tier, g});
  // lock inputs
  stage.querySelectorAll('.opts,.cal,.chips').forEach(x=>x.classList.add('locked'));
  stage.querySelectorAll('[data-v]').forEach(b=>{ b.disabled = true;
    if(l.type==='choice'||l.type==='big'){ if(b.dataset.v===l.answer) b.classList.add('right'); else if(b.dataset.v===g) b.classList.add('wrong'); }
    if(l.type==='week'||l.type==='cal'){ if(+b.dataset.v===l.answer) b.classList.add('right'), b.style.cssText+='border-color:var(--blue);background:var(--blue-l);'; }
  });
  stage.querySelectorAll('input,.step').forEach(x=>x.disabled=true);
  if(l.type==='cal'||l.type==='week') stage.querySelector('.cal,.chips').hidden=true;
  const rv=$('#rv'); rv.innerHTML=`<div class="reveal">${l.type==='slider'?meter(l,g):''}${l.reveal(g)}</div>`;
  rv.querySelectorAll('.big-n').forEach(el=>countNum(el));
  requestAnimationFrame(()=>requestAnimationFrame(()=>rv.querySelectorAll('.pin[data-l]').forEach(e=>e.style.left=e.dataset.l+'%')));
  requestAnimationFrame(()=>requestAnimationFrame(()=>rv.querySelectorAll('[data-w]').forEach(e=>e.style.width=e.dataset.w+'%')));
  // feedback
  const msg = {
    perfect:['Spot on.', ['Sawa sawa. You read Amani like a book.','Exactly right. Dithi is impressed.','Nailed it.']],
    close:['So close.', ['Near enough to count for your streak.','Almost. Your streak lives on.']],
    miss:['Plot twist.', ['Most people guess that too. Look at this.','Not this time. The real answer is below.']]
  }[tier];
  $('#fbTitle').textContent=msg[0]; const said = l.type==='slider' ? `You said ${l.money?'KES ':''}${fmt(g)}. It was ${l.money?'KES ':''}${fmt(l.answer)}.` : msg[1][S.i%msg[1].length];
  $('#fbText').textContent=' '+said+`  +${gain} XP`;
  $('#fbBadge').textContent = tier==='perfect'?'🎯':tier==='close'?'👌':'👀';
  foot.className='foot '+tier; btn.disabled=false; btn.textContent = S.i===L.length-1?'See my card':'Continue';
  const dz=$('#dz'); dz.className='dithi '+(tier==='miss'?'shake':'hop'); dz.innerHTML=dithi(tier==='miss'?'wow':'cheer');
  setStats(true, tier!=='miss');
  flyXp(gain);
  if(tier==='perfect') confetti(70);
  if(S.streak>0 && S.streak%3===0) toast(`🔥 ${S.streak} in a row`);
  setTimeout(()=>{ const rvEl=rv.firstElementChild; if(rvEl) stage.scrollTo({top: rvEl.offsetTop - 80, behavior: RM?'auto':'smooth'}); }, 250);
  btn.focus({preventScroll:true});
}
function meter(l,g){
  const pc=v=>((v-l.min)/(l.max-l.min)*100).toFixed(2);
  const a=Math.min(pc(g),pc(l.answer)), b=Math.max(pc(g),pc(l.answer));
  const lab=v=>(l.money?'KES ':'')+fmt(v);
  return `<div class="meter" role="img" aria-label="Your guess ${lab(g)}, the real answer ${lab(l.answer)}"><div class="tr"></div><div class="gap" style="left:${a}%;width:${b-a}%"></div>
    <div class="pin you" data-l="${pc(g)}" style="left:${pc(g)}%;--x:${pc(g)}"><span>You · ${lab(g)}</span><i></i></div>
    <div class="pin real" data-l="${pc(l.answer)}" style="left:${pc(g)}%;--x:${pc(l.answer)}"><i></i><span>Real · ${lab(l.answer)}</span></div></div>`;
}
function countNum(el){
  const m=el.textContent.match(/[\d,.]+/); if(!m||RM) return;
  const target=parseFloat(m[0].replace(/,/g,'')), dec=(m[0].split('.')[1]||'').length, pre=el.textContent.slice(0,m.index), post=el.textContent.slice(m.index+m[0].length);
  const t0=performance.now(); const f=t=>{const p=Math.min(1,(t-t0)/1100), v=target*(1-Math.pow(1-p,3));
    el.textContent=pre+v.toLocaleString('en-GB',{minimumFractionDigits:p<1?0:dec,maximumFractionDigits:p<1?0:dec})+post; if(p<1)requestAnimationFrame(f);};
  requestAnimationFrame(f);
}
function flyXp(n){
  const b=btn.getBoundingClientRect(); const e=document.createElement('div'); e.className='xpfly'; e.textContent='+'+n+' XP';
  e.style.left=(b.left+b.width/2-30)+'px'; e.style.top=(b.top-30)+'px'; document.body.appendChild(e); setTimeout(()=>e.remove(),1200);
}
btn.onclick=()=>{ if(S.phase==='intro'){ $('#top').hidden=false; next(); return; } if(S.phase==='ask'){ if(!btn.disabled) check(); } else next(); };
$('#quit').onclick=intro;
document.addEventListener('keydown',e=>{
  if(S.i<0||S.i>=L.length) return;
  if(e.key==='Enter' && document.activeElement.tagName!=='BUTTON' && !btn.disabled){ e.preventDefault(); btn.click(); }
  const n=+e.key; const l=L[S.i];
  if(S.phase==='ask' && n>=1 && (l.type==='choice'||l.type==='big')){ const b=stage.querySelectorAll('[data-v]')[n-1]; if(b) b.click(); }
});

/* ---- end ---- */
function end(){
  S.i=L.length; setStats();
  foot.hidden=true;
  const pct = Math.round(S.results.filter(r=>r.tier!=='miss').length/L.length*100);
  const rank = S.spot>=6?'Money whisperer':S.spot>=3?'Sharp reader':'Fresh eyes';
  stage.innerHTML=`<div class="screen end">
    <div class="dithi hop" style="width:110px;height:110px;margin:4px auto 0">${dithi('cheer')}</div>
    <div class="trophy">Run complete</div>
    <p style="margin:2px 0;color:var(--muted)">You've read a whole year of Amani's money.</p>
    <div class="stats3">
      <div class="st a"><div class="h">Total XP</div><div class="v" id="xpCount">0</div></div>
      <div class="st b"><div class="h">Spot on</div><div class="v">${S.spot}/${L.length}</div></div>
      <div class="st c"><div class="h">Best streak</div><div class="v">🔥 ${S.best}</div></div>
    </div>
    <div class="card" id="share" role="img" aria-label="Share card summarising Amani's year">
      <div class="sp"></div>
      <div class="brand"><span>Pesadithi</span><span>Nov 2025 to Nov 2026</span></div>
      <div class="stk" aria-hidden="true">${dithi('cheer')}</div>
      <h3>Amani's year<br>in mobile money</h3>
      <div class="grid">
        <div class="g"><b><small>KES</small>${fmt(D.totals.in)}</b><span>came in</span></div>
        <div class="g"><b><small>KES</small>${fmt(D.totals.out)}</b><span>went out</span></div>
        <div class="g"><b>${D.halfLifeDays} days</b><span>for half of payday to go</span></div>
        <div class="g"><b>${fz.daysOwing} days</b><span>ended owing Fuliza</span></div>
        <div class="g"><b>${places[0].payments} visits</b><span>to ${title(places[0].name)}</span></div>
        <div class="g"><b><small>KES</small>${fmt(D.totals.avoidable)}</b><span>in avoidable fees</span></div>
      </div>
      <div class="foot2"><span>I got ${S.spot}/${L.length} spot on.<br>Can you beat it?</span><span class="score">${rank}</span></div>
    </div>
    <div class="actions">
      <button class="btn sun" id="shareBtn">Share the challenge</button>
      <button class="btn ghost" id="again">Play again</button>
    </div>
    <div class="demo" style="margin-top:16px">Invented demo data for a fictional person</div>
    <p class="credit">Pesadithi · made by Mark Kaigwa · <a href="https://mark.co.ke" target="_blank" rel="noopener">mark.co.ke</a></p>
  </div>`;
  stage.scrollTop=0;
  confetti(160);
  countUp($('#xpCount'), S.xp);
  $('#again').onclick=intro;
  $('#shareBtn').onclick=async()=>{
    const text=`I scored ${S.spot}/${L.length} guessing Amani's year in mobile money on Pesadithi. Half of payday gone in ${D.halfLifeDays} days, ${fz.daysOwing} days owing Fuliza. Can you beat me? (Invented demo data.) mark.co.ke`;
    try{ if(navigator.share){ await navigator.share({title:'Pesadithi', text}); return; } }catch(e){ if(e && e.name==='AbortError') return; }
    try{ await navigator.clipboard.writeText(text); toast('Challenge copied. Paste it anywhere.'); }catch(e){ toast('Sharing is not available here.'); }
  };
  $('#shareBtn').focus({preventScroll:true});
}
function countUp(el,n){ if(RM){el.textContent=n;return;} const t0=performance.now(); const f=t=>{const p=Math.min(1,(t-t0)/900); el.textContent=Math.round(n*(1-Math.pow(1-p,3))); if(p<1)requestAnimationFrame(f);}; requestAnimationFrame(f); }
let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),2200); }

/* ---- confetti ---- */
const cv=$('#confetti'), cx=cv.getContext('2d'); let parts=[], raf=null;
function confetti(n){
  if(RM) return;
  cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio; cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  const cols=['#1CB0F6','#FFC800','#8E4DF0','#FF9600','#58CC02','#FF4B4B'];
  for(let i=0;i<n;i++) parts.push({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.55,vx:(Math.random()-.5)*14,vy:-Math.random()*16-6,r:Math.random()*6+4,c:cols[i%6],a:Math.random()*6,va:(Math.random()-.5)*.4,life:0});
  if(!raf) raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;p.life++;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore();});
  parts=parts.filter(p=>p.y<innerHeight+40&&p.life<240);
  raf=parts.length?requestAnimationFrame(tick):(cx.clearRect(0,0,innerWidth,innerHeight),null);
}

intro();
})();
</script>
</body>
