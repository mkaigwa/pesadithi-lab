<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pesadithi · Your year in mobile money</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700;800;900&family=Figtree:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141B34; --ink2:#4A5372; --ink3:#7B84A3;
  --bg:#EDF0F7; --card:#FFFFFF; --line:#E1E5EF;
  --in:#12A150; --in-soft:#DDF6E7;
  --out:#E5384A; --out-soft:#FFE3E6;
  --fz:#7A4DFF; --fz-soft:#ECE5FF;
  --blue:#2F5BFF; --sun:#FFC933; --pink:#FF6FB5; --orange:#FF8A3D; --sky:#3BA7FF;
  --r:22px;
  --display:'Schibsted Grotesk', system-ui, sans-serif;
  --body:'Figtree', system-ui, sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-family:var(--display);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{max-width:480px;margin:0 auto;padding:14px 16px 40px}
.top{display:flex;align-items:center;gap:12px;padding:6px 2px 14px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px;flex:none}
.hello{flex:1;min-width:0}
.hello b{display:block;font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.hello span{font-size:13.5px;color:var(--ink2);font-weight:600}
.demo{font-size:11.5px;font-weight:700;color:var(--ink2);background:#fff;border:1px solid var(--line);padding:6px 10px;border-radius:999px;white-space:nowrap}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;background:var(--blue);color:#fff;border-radius:28px;padding:22px 20px 20px;box-shadow:0 18px 40px -22px rgba(47,91,255,.7)}
.hero .eyebrow{font-size:13px;font-weight:700;opacity:.85;letter-spacing:.02em}
.hero h1{font-family:var(--display);font-size:34px;line-height:1.02;margin:6px 0 16px;font-weight:800;letter-spacing:-.03em;max-width:12ch}
.hero .blob{position:absolute;border-radius:50%;pointer-events:none}
.hero .b1{width:150px;height:150px;background:var(--sun);right:-58px;top:-58px}
.hero .b2{width:42px;height:42px;background:var(--pink);right:84px;top:34px}
.hero .b3{width:120px;height:120px;border:16px solid rgba(255,255,255,.12);right:-40px;bottom:-30px;background:none}
.hero h1,.hero .eyebrow{position:relative;z-index:1}
.flows{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.flow{background:rgba(255,255,255,.14);border-radius:16px;padding:12px 12px 11px}
.flow small{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;opacity:.92}
.flow .dot{width:9px;height:9px;border-radius:50%}
.flow .num{display:block;font-size:22px;margin-top:3px;white-space:nowrap}
.cur{font-size:.5em;letter-spacing:.02em;margin-right:.18em;font-weight:800;opacity:.85;vertical-align:.12em}
.flow .bar{display:block;height:6px;border-radius:6px;background:rgba(255,255,255,.18);margin-top:8px;overflow:hidden}
.flow .bar i{display:block;height:100%;border-radius:6px}
.hero .net{position:relative;font-size:14px;font-weight:600;margin:0 0 16px;opacity:.95}
.play{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;background:#fff;color:var(--ink);border-radius:999px;padding:15px 18px;font-weight:800;font-size:16px;transition:transform .15s}
.play:hover{transform:translateY(-1px)}
.play:active{transform:scale(.98)}
.play svg{width:20px;height:20px}
.play::after{content:"";position:absolute;inset:-6px;border-radius:999px;border:3px solid rgba(255,255,255,.55);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{opacity:.9;transform:scale(.97)}70%,100%{opacity:0;transform:scale(1.06)}}
.card.rise{opacity:0;transform:translateY(22px)}
.card{transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.2,1)}

/* ---------- section heads ---------- */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:28px 4px 12px}
.sec h2{font-family:var(--display);font-size:21px;font-weight:800;margin:0;letter-spacing:-.02em}
.sec span{font-size:13px;color:var(--ink2);font-weight:600}

/* ---------- categories ---------- */
.cats{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 16px 8px;margin:0 -16px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;scroll-snap-align:start;width:136px;text-align:left;border:0;background:var(--card);border-radius:20px;padding:14px 13px 13px;box-shadow:0 1px 0 var(--line);transition:transform .15s}
.cat:hover{transform:translateY(-2px)}
.cat .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;margin-bottom:12px}
.cat .ic svg{width:22px;height:22px}
.cat b{display:block;font-size:13.5px;font-weight:700;line-height:1.2;min-height:2.4em}
.cat .num{display:block;font-size:18px;margin-top:4px;color:var(--out);white-space:nowrap}
.cat .pc{display:block;font-size:12px;color:var(--ink3);font-weight:600}

/* ---------- feed ---------- */
.feed{display:grid;gap:14px}
.card{background:var(--card);border-radius:var(--r);padding:18px 18px 16px;box-shadow:0 1px 0 var(--line);position:relative;overflow:hidden}
.card .tag{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;padding:5px 10px 5px 7px;border-radius:999px}
.card .tag svg{width:16px;height:16px}
.card .big{display:block;font-size:44px;line-height:1;margin:14px 0 4px}
.card .big small{font-size:20px;letter-spacing:0;margin-left:2px}
.card h3{font-size:16.5px;font-weight:700;margin:0 0 12px;line-height:1.3}
.card .chart{margin:4px 0 12px}
.card .chart svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--body)}
.nudge{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border-radius:14px;padding:11px 12px;font-size:14px;line-height:1.42;color:var(--ink);font-weight:500}
.nudge svg{width:20px;height:20px;flex:none;margin-top:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2);font-weight:600;margin:-4px 0 12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
.card.block{color:#fff}
.card.block h3,.card.block .big{color:#fff}
.card.block .nudge{background:rgba(255,255,255,.16);color:#fff}
.card.block .tag{background:rgba(255,255,255,.2);color:#fff}
.rows{list-style:none;margin:0 0 12px;padding:0}
.rows li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
.rows li:last-child{border-bottom:0}
.rows li span:last-child{font-family:var(--display);font-weight:800;white-space:nowrap}
.receipts{display:flex;gap:10px;margin:4px 0 14px}
.rcpt{flex:1;border:2px dashed var(--line);border-radius:14px;padding:11px 12px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.rcpt b{display:block;font-family:var(--display);font-size:19px;color:var(--out);margin-top:2px}
.rcpt.dup{border-color:var(--out);background:var(--out-soft)}

.credit{margin:34px 4px 0;text-align:center;font-size:13px;color:var(--ink2);font-weight:600;line-height:1.7}
.credit a{color:var(--ink);font-weight:800}
.credit .demo2{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;margin-bottom:6px}

/* ---------- feed motion ---------- */
function tween(node,final,dec){if(RM){return;}const st=performance.now(),d=1000;const f=t=>{const p=Math.min(1,(t-st)/d),e=1-Math.pow(1-p,3);const v=final*e;node.nodeValue=dec?v.toFixed(dec):fmt(v);if(p<1)requestAnimationFrame(f);else node.nodeValue=dec?final.toFixed(dec):fmt(final);};requestAnimationFrame(f);}
function countBig(el){const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const m=n.nodeValue.match(/^(\d[\d,]*)(\.\d+)?$/);if(m){const dec=m[2]?m[2].length-1:0;tween(n,parseFloat(n.nodeValue.replace(/,/g,'')),dec);}}}
if('IntersectionObserver' in window && !RM){
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.remove('rise');countBig(e.target.querySelector('.big'));io.unobserve(e.target);}}),{threshold:.2});
  document.querySelectorAll('.feed .card').forEach(c=>{c.classList.add('rise');io.observe(c);});
}
function stick(){const sd=document.querySelector('.side');if(!sd)return;const h=sd.offsetHeight;document.documentElement.style.setProperty('--stick',Math.min(24,innerHeight-h-24)+'px');}
addEventListener('resize',stick);addEventListener('load',stick);stick();

/* ---------- bottom sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,27,52,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;max-height:86vh;overflow:auto;background:#fff;border-radius:28px 28px 0 0;padding:10px 20px 28px;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:41}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 14px}
.sheet .head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.sheet .head .ic{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;flex:none}
.sheet .head .ic svg{width:28px;height:28px}
.sheet h2{font-family:var(--display);font-size:24px;margin:0;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.sheet .head p{margin:2px 0 0;color:var(--ink2);font-size:14px;font-weight:600}
.x{margin-left:auto;width:40px;height:40px;border-radius:50%;border:0;background:var(--bg);display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--bg);border-radius:16px;padding:11px 11px 10px}
.stat small{display:block;font-size:11.5px;font-weight:700;color:var(--ink2)}
.stat .num{font-size:18px;white-space:nowrap}
.sheet h4{margin:4px 0 6px;font-size:14px;font-weight:800;color:var(--ink2);text-transform:none}
.share-bar{height:12px;border-radius:12px;background:var(--bg);overflow:hidden;margin:2px 0 6px;display:flex}
.share-bar i{display:block;height:100%}

/* ---------- stories ---------- */
.story{position:fixed;inset:0;z-index:60;display:none;background:rgba(20,27,52,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.story.on{display:block}
.stage{position:absolute;inset:0;margin:auto;max-width:480px;overflow:hidden;background:var(--blue);color:#fff;transition:background-color .45s}
.bars{position:absolute;top:12px;left:14px;right:14px;display:flex;gap:4px;z-index:3}
.bars i{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.35);overflow:hidden}
.bars i b{display:block;height:100%;width:0;background:#fff}
.bars i.done b{width:100%}
.sclose{position:absolute;top:26px;right:12px;z-index:4;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;color:#fff}
.sclose svg{width:20px;height:20px}
.slabel{position:absolute;top:34px;left:18px;z-index:3;font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px}
.slabel .mini{width:26px;height:26px;border-radius:50%;background:var(--sun);color:var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:13px}
.tapzone{position:absolute;top:80px;bottom:90px;z-index:2;border:0;background:transparent}
.tapzone.prev{left:0;width:34%}
.tapzone.next{right:0;width:66%}
.slide{position:absolute;inset:0;padding:110px 26px 120px;display:flex;flex-direction:column;justify-content:center}
.slide .k{font-size:17px;font-weight:700;opacity:.92;margin:0 0 10px;max-width:22ch}
.slide .huge{font-family:var(--display);font-weight:800;font-size:clamp(54px,17vw,84px);line-height:.92;letter-spacing:-.04em;margin:0}
.slide .huge small{display:block;font-size:.38em;letter-spacing:-.01em;margin-bottom:4px}
.slide .sub{font-size:18px;font-weight:600;margin:16px 0 0;max-width:24ch;line-height:1.35}
.slide .art{position:absolute;pointer-events:none}
.slide svg.sc{width:100%;height:auto;margin-top:26px;overflow:visible}
.slide .deco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.slide .deco i{position:absolute;border-radius:50%;display:block}
.slide>*:not(.deco){position:relative}
.slide .anim{opacity:0;transform:translateY(18px);transition:opacity .5s,transform .5s cubic-bezier(.2,.8,.2,1)}
.slide.in .anim{opacity:1;transform:none}
.slide.in .anim.d1{transition-delay:.12s}.slide.in .anim.d2{transition-delay:.3s}.slide.in .anim.d3{transition-delay:.5s}
.snav{position:absolute;left:0;right:0;bottom:22px;z-index:4;display:flex;justify-content:center;gap:10px;padding:0 18px}
.snav button{border:0;border-radius:999px;padding:13px 20px;font-weight:800;background:rgba(255,255,255,.2);color:#fff;min-width:96px}
.snav button.solid{background:#fff;color:var(--ink)}
.snav button[hidden]{display:none}
.wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.wrap .w{background:rgba(255,255,255,.95);color:var(--ink);border-radius:18px;padding:12px 13px}
.wrap .w small{display:block;font-size:12px;font-weight:700;color:var(--ink2)}
.wrap .w .num{font-size:21px;display:block;line-height:1.15;margin-top:2px}
.wrap .w.wide{grid-column:1/-1}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--ink);color:#fff;font-weight:700;font-size:14px;padding:11px 18px;border-radius:999px;opacity:0;transition:.25s;z-index:80;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- desktop ---------- */
@media (min-width:980px){
  .app{max-width:1220px;display:grid;grid-template-columns:400px 1fr;gap:36px;padding:28px 32px 48px;align-items:start}
  .side{position:sticky;top:var(--stick,24px)}
  .cats{display:grid;grid-template-columns:1fr 1fr 1fr;overflow:visible;margin:0;padding:0}
  .cat{width:auto}
  .main .sec:first-child{margin-top:8px}
  .feed{display:block;columns:2;column-gap:16px}
  .feed .card{break-inside:avoid;margin-bottom:16px}
  .credit{grid-column:1/-1}
  .stage{border-radius:30px;top:24px;bottom:24px;height:auto;max-width:430px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
  .slide .anim{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="app">
  <div class="side">
    <header class="top">
      <div class="avatar" aria-hidden="true">A</div>
      <div class="hello"><b>Hi, Amani</b><span>Your year is ready</span></div>
      <span class="demo" title="All figures are invented demo data for a fictional person">Demo data · fictional</span>
    </header>

    <section class="hero" aria-labelledby="heroTitle">
      <span class="blob b1" aria-hidden="true"></span><span class="blob b2" aria-hidden="true"></span>
      <div class="eyebrow">Pesadithi</div>
      <h1 id="heroTitle">Your year in mobile money</h1>
      <div class="flows" id="flows"></div>
      <p class="net" id="net"></p>
      <button class="play" id="playYear" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="var(--blue)"/><path d="M10 8l6 4-6 4z" fill="#fff"/></svg>
        Play your year
      </button>
    </section>

    <div class="sec"><h2>Where it went</h2><span>Tap a category</span></div>
    <div class="cats" id="cats" role="list"></div>
  </div>

  <main class="main">
    <div class="sec"><h2>For you</h2><span id="feedCount"></span></div>
    <div class="feed" id="feed"></div>
  </main>

  <footer class="credit">
    <span class="demo2">Invented demo data · Amani is a fictional person</span><br>
    Pesadithi · made by Mark Kaigwa · <a href="https://mark.co.ke" target="_blank" rel="noopener">mark.co.ke</a>
  </footer>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true" tabindex="-1"></div>

<div class="story" id="story" role="dialog" aria-modal="true" aria-label="Your year in mobile money" aria-hidden="true">
  <div class="stage" id="stage">
    <div class="bars" id="bars" aria-hidden="true"></div>
    <div class="slabel"><span class="mini" aria-hidden="true">A</span>Amani's year</div>
    <button class="sclose" id="sclose" type="button" aria-label="Close your year"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
    <button class="tapzone prev" id="tprev" type="button" aria-label="Previous" tabindex="-1"></button>
    <button class="tapzone next" id="tnext" type="button" aria-label="Next" tabindex="-1"></button>
    <div id="slides" aria-live="polite"></div>
    <div class="snav"><button type="button" id="bprev">Back</button><button type="button" class="solid" id="bnext">Next</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

function bars(vals,{w=320,h=84,color='var(--ink)',hi=-1,hiColor,labels,gap=.32,soft='#E1E5EF',labelEvery=1,minH=3}={}){
  const n=vals.length, max=Math.max(...vals,1), bw=w/n, lh=labels?18:0, ch=h-lh;
  let s='';
  vals.forEach((v,i)=>{const bh=v>0?Math.max(minH,v/max*(ch-4)):2;const x=i*bw+bw*gap/2;const col=(Array.isArray(hi)?hi.includes(i):i===hi)?(hiColor||color):(v>0?color:soft);
    s+=`<rect x="${x.toFixed(1)}" y="${(ch-bh).toFixed(1)}" width="${(bw*(1-gap)).toFixed(1)}" height="${bh.toFixed(1)}" rx="${Math.min(4,bw*(1-gap)/2).toFixed(1)}" fill="${col}"/>`;
    if(labels&&i%labelEvery===0) s+=`<text x="${(i*bw+bw/2).toFixed(1)}" y="${h-3}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink3)" font-family="Figtree">${labels[i]}</text>`;});

}

 {bg:'#141B34', html:`<p class="k anim">You made</p><p class="huge anim d1"><span class="count" data-to="${D.transactions}">${fmt(D.transactions)}</span></p><p class="sub anim d2">transactions. That's about ${Math.round(D.transactions/D.days)} for every day of the year.</p>`, art:()=>dotGrid(D.transactions,30,'rgba(255,255,255,.85)'), deco:[[200,'var(--blue)','right:-80px','top:-70px']]},
 {bg:'var(--in)', html:`<p class="k anim">Money in</p><p class="huge anim d1"><small>KES</small><span class="count" data-to="${T.in}">${fmt(T.in)}</span></p><p class="sub anim d2">landed with you. Most of it on the ${ord(D.bigInflowDays[0])}, like clockwork.</p>`, art:()=>monthBars('in','#fff'), deco:[[220,'rgba(255,255,255,.14)','right:-90px','top:-40px']]},
 {bg:'var(--out)', html:`<p class="k anim">Money out</p><p class="huge anim d1"><small>KES</small><span class="count" data-to="${T.out}">${fmt(T.out)}</span></p><p class="sub anim d2">went back out. The biggest slice, ${kes(cats[0].total)}, kept a roof over your head.</p>`, art:catStack, deco:[[180,'rgba(255,255,255,.14)','left:-70px','top:-30px']]},
 {bg:'#E8691A', html:`<p class="k anim">Your place</p><p class="huge anim d1" style="font-size:clamp(44px,13vw,66px)">${title(favPlace.name)}</p><p class="sub anim d2">${favPlace.payments} visits. You and ${title(favPlace.name).split(' ')[0]} House go way back now.</p>`, art:()=>iconRow(favPlace.payments,'cup',9,'#fff'), deco:[[240,'var(--sun)','right:-110px','top:-80px']]},
 {bg:'#E0408F', html:`<p class="k anim">Your person</p><p class="huge anim d1" style="font-size:clamp(48px,14vw,72px)">${title(mama.name)}</p><p class="sub anim d2">${kes(mama.total)} over ${mama.sends} sends. More than everyone else you sent to, put together.</p>`, art:()=>heartRow(mama.sends), deco:[[200,'#FF8FC6','left:-80px','top:-50px'],[70,'var(--sun)','right:30px','top:120px']]},
 {bg:'var(--fz)', html:`<p class="k anim">Your glow-up</p><p class="huge anim d1">${fzBeforeMar} → ${fzSinceMar}</p><p class="sub anim d2">Days owing Fuliza: ${fzBeforeMar} from November to February, just ${fzSinceMar} since March.</p>`, chart:true, deco:[[220,'rgba(255,255,255,.12)','right:-80px','top:-60px'],[60,'#5BE38F','left:30px','top:130px']]},
 {bg:'#141B34', html:`<p class="k anim">Your moment</p><p class="huge anim d1">${DAYS[D.habits.peakWeekday].slice(0,3)}, ${hr(D.habits.peakHour)}</p><p class="sub anim d2">${DAYS[D.habits.peakWeekday]} is your biggest spending day, and ${Math.round(D.habits.weekendShare*100)}% of your spending happens at the weekend.</p>`, art:weekBars, deco:[[180,'var(--sun)','right:-70px','top:-50px','opacity:.9']]},
 {bg:'var(--sun)', ink:true, html:`<p class="k anim">Next year's easy win</p><p class="huge anim d1"><small>KES</small><span class="count" data-to="${T.avoidable}">${fmt(T.avoidable)}</span></p><p class="sub anim d2">in penalties and missed cashback you can simply keep. Pay loans back early and it's yours.</p>`, art:easyRows, deco:[[220,'#fff','right:-90px','top:-70px','opacity:.5'],[80,'var(--orange)','left:-26px','bottom:140px']]},
 {bg:'var(--blue)', share:true, deco:[[200,'var(--sun)','right:-80px','top:-70px'],[70,'var(--pink)','left:-20px','bottom:120px']], html:`<p class="k anim" style="margin-bottom:12px">Amani's year, wrapped</p>
   <div class="wrap anim d1">
    <div class="w"><small>Came in</small><span class="num" style="color:var(--in)">${kes(T.in)}</span></div>
    <div class="w"><small>Went out</small><span class="num" style="color:var(--out)">${kes(T.out)}</span></div>
    <div class="w"><small>Your place</small><span class="num" style="font-size:17px">${title(favPlace.name)}</span></div>
    <div class="w"><small>Your person</small><span class="num" style="font-size:17px">${title(mama.name)}</span></div>
    <div class="w"><small>Fuliza days since March</small><span class="num" style="color:var(--fz)">${fzSinceMar}</span></div>
    <div class="w"><small>Easy win next year</small><span class="num">${kes(T.avoidable)}</span></div>
   </div>
   <p class="sub anim d2" style="font-size:13px;opacity:.85;margin-top:14px">Invented demo data for a fictional person · Pesadithi · made by Mark Kaigwa · mark.co.ke</p>`}
];

/* ---------- story art ---------- */
const deco = list => `<div class="deco" aria-hidden="true">${list.map(([w,c,x,y,extra])=>`<i style="width:${w}px;height:${w}px;background:${c};${x};${y};${extra||''}"></i>`).join('')}</div>`;
function dotGrid(n,cols,color){const r=3.2,g=10.6;let o='';for(let i=0;i<n;i++){o+=`<circle cx="${(i%cols)*g+r}" cy="${Math.floor(i/cols)*g+r}" r="${r}" fill="${color}"/>`;}const rows=Math.ceil(n/cols);return `<svg class="sc anim d3" viewBox="0 0 ${cols*g} ${rows*g}" role="img" aria-label="${n} dots, one for each transaction">${o}</svg>`;}
function monthBars(key,color){const ms=months;const vals=ms.map(m=>m[key]);return `<svg class="sc anim d3" viewBox="0 0 320 100" role="img" aria-label="Money ${key==='in'?'in':'out'} by month">${bars(vals,{w:320,h:100,color,labels:ms.map(m=>MON[+m.month.slice(5)-1][0]),minH:4}).replace(/fill="var\(--ink3\)"/g,'fill="rgba(255,255,255,.85)"')}</svg>`;}
function catStack(){let x=0,o='',lab='';const top=cats.slice(0,4);const cols=['#fff','rgba(255,255,255,.75)','rgba(255,255,255,.55)','rgba(255,255,255,.4)'];
  cats.forEach((c,i)=>{const w=c.total/catTotal*320;o+=`<rect x="${x.toFixed(1)}" y="0" width="${Math.max(0,w-2).toFixed(1)}" height="44" rx="6" fill="${cols[i]||'rgba(255,255,255,.22)'}"/>`;x+=w;});
  top.forEach((c,i)=>{lab+=`<text x="0" y="${70+i*20}" font-size="13" font-weight="700" fill="#fff">${c.category}</text><text x="320" y="${70+i*20}" text-anchor="end" font-size="13" font-weight="800" fill="#fff">${pct(c.total/catTotal)}</text>`;});
  return `<svg class="sc anim d3" viewBox="0 0 320 140" role="img" aria-label="Spending split by category. ${top.map(c=>c.category+' '+pct(c.total/catTotal)).join(', ')}.">${o}${lab}</svg>`;}
function iconRow(n,k,cols,color){let o='';const g=320/cols;for(let i=0;i<n;i++){o+=`<g transform="translate(${(i%cols)*g+(g-22)/2} ${Math.floor(i/cols)*30})" stroke="${color}" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[k]}</g>`;}return `<svg class="sc anim d3" viewBox="0 0 320 ${Math.ceil(n/cols)*30}" role="img" aria-label="${n} icons">${o}</svg>`;}
function heartRow(n){let o='';const g=320/6;for(let i=0;i<n;i++){o+=`<g transform="translate(${(i%6)*g+g/2-18} ${Math.floor(i/6)*48}) scale(1.5)">${P.heart.replace('<path','<path fill="#fff"')}</g>`;}return `<svg class="sc anim d3" viewBox="0 0 320 ${Math.ceil(n/6)*48}" role="img" aria-label="${n} hearts, one for each send">${o}</svg>`;}
function weekBars(){return `<svg class="sc anim d3" viewBox="0 0 320 100" role="img" aria-label="Spending by weekday, ${DAYS[D.habits.peakWeekday]} highest">${bars(weekdayTotals,{w:320,h:100,color:'rgba(255,255,255,.35)',hi:D.habits.peakWeekday,hiColor:'var(--sun)',labels:['M','T','W','T','F','S','S']}).replace(/fill="var\(--ink3\)"/g,'fill="rgba(255,255,255,.85)"')}</svg>`;}
function easyRows(){return `<div class="wrap anim d3" style="grid-template-columns:1fr;gap:6px;margin-top:22px">${D.avoidable.map(a=>`<div class="w" style="display:flex;justify-content:space-between;padding:10px 13px;background:rgba(255,255,255,.7)"><small style="font-size:13px;color:var(--ink)">${a.what}</small><span class="num" style="font-size:15px;margin:0">${kes(a.amount)}</span></div>`).join('')}</div>`;}

const story=$('#story'), stage=$('#stage'), slidesEl=$('#slides'), barsEl=$('#bars');
let si=0, timer=null, t0=0, DUR=6000, raf=null;
barsEl.innerHTML=S.map(()=>'<i><b></b></i>').join('');
function fzChart(){const vals=months.map(m=>m.daysOwingFuliza);return `<svg class="sc anim d3" viewBox="0 0 320 90" role="img" aria-label="Days owing Fuliza by month">${bars(vals,{w:320,h:90,color:'#fff',soft:'rgba(255,255,255,.35)',labels:months.map(m=>MON[+m.month.slice(5)-1][0]),minH:4}).replace(/fill="var\(--ink3\)"/g,'fill="rgba(255,255,255,.85)"')}</svg>`;}
function show(i){
  si=Math.max(0,Math.min(S.length-1,i));const s=S[si];
  stage.style.backgroundColor='';stage.style.background=s.bg;stage.style.color=s.ink?'var(--ink)':'#fff';
  slidesEl.innerHTML=`<section class="slide" aria-roledescription="slide" aria-label="${si+1} of ${S.length}">${s.deco?deco(s.deco):''}${s.html}${s.chart?fzChart():''}${s.art?s.art():''}</section>`;
  const el=slidesEl.firstChild; requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('in')));
  [...barsEl.children].forEach((b,j)=>{b.classList.toggle('done',j<si);b.firstChild.style.width=j<si?'100%':'0';});
  barsEl.querySelectorAll('i').forEach(b=>b.style.background=s.ink?'rgba(20,27,52,.2)':'');
  barsEl.querySelectorAll('b').forEach(b=>b.style.background=s.ink?'var(--ink)':'');
  $('#sclose').style.background=s.ink?'rgba(20,27,52,.12)':'';$('#sclose').style.color=s.ink?'var(--ink)':'';
  document.querySelector('.slabel').style.color=s.ink?'var(--ink)':'';document.querySelector('.slabel .mini').style.background=s.ink?'#fff':'';
  const bp=$('#bprev'), bn=$('#bnext');
  bp.style.background=s.ink?'rgba(20,27,52,.12)':''; bp.style.color=s.ink?'var(--ink)':'';
  bp.hidden=si===0;
  if(s.share){bn.innerHTML='Share my year';bn.dataset.mode='share';bp.textContent='Replay';bp.dataset.mode='replay';bp.hidden=false;}
  else{bn.textContent=si===0?'Start':'Next';bn.dataset.mode='next';bp.textContent='Back';bp.dataset.mode='back';}
  el.querySelectorAll('.count').forEach(countUp);
  startTimer();
}
function countUp(el){const to=+el.dataset.to;if(RM){el.textContent=fmt(to);return;}const st=performance.now(),d=1100;
  const step=t=>{const p=Math.min(1,(t-st)/d),e=1-Math.pow(1-p,3);el.textContent=fmt(to*e);if(p<1)requestAnimationFrame(step);};el.textContent='0';requestAnimationFrame(step);}
function startTimer(){cancelAnimationFrame(raf);if(RM||S[si].share)return;t0=performance.now();const b=barsEl.children[si].firstChild;
  const tick=t=>{const p=Math.min(1,(t-t0)/DUR);b.style.width=(p*100)+'%';if(p>=1){next();return;}raf=requestAnimationFrame(tick);};raf=requestAnimationFrame(tick);}
function next(){if(si<S.length-1)show(si+1);else cancelAnimationFrame(raf);}
function prev(){show(si-1);}
function openStory(){lastFocus=document.activeElement;story.classList.add('on');story.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';show(0);setTimeout(()=>$('#bnext').focus(),60);}
function closeStory(){cancelAnimationFrame(raf);story.classList.remove('on');story.setAttribute('aria-hidden','true');document.body.style.overflow='';lastFocus&&lastFocus.focus();}
$('#playYear').addEventListener('click',openStory);
$('#sclose').addEventListener('click',closeStory);
$('#tnext').addEventListener('click',next);$('#tprev').addEventListener('click',prev);
$('#bprev').addEventListener('click',e=>{e.currentTarget.dataset.mode==='replay'?show(0):prev();});
$('#bnext').addEventListener('click',e=>{e.currentTarget.dataset.mode==='share'?shareYear():next();});
story.addEventListener('click',e=>{if(e.target===story)closeStory();});

async function shareYear(){
  const text=`My Pesadithi year: ${fmt(D.transactions)} transactions, ${kes(T.in)} in, ${kes(T.out)} out. Fuliza days since March: ${fzSinceMar}. Easy win for next year: ${kes(T.avoidable)}. (Demo data for a fictional person.) Pesadithi · made by Mark Kaigwa · mark.co.ke`;
  try{ if(navigator.share){await navigator.share({title:'My Pesadithi year',text});return;} }catch(e){ if(e&&e.name==='AbortError')return; }
  try{ await navigator.clipboard.writeText(text); toast('Copied. Paste it anywhere you like.'); }
  catch(e){ toast('Sharing is not available in this viewer'); }
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2600);}

document.addEventListener('keydown',e=>{
  if(story.classList.contains('on')){
    if(e.key==='ArrowRight'){e.preventDefault();next();}
    else if(e.key==='ArrowLeft'){e.preventDefault();prev();}
    else if(e.key==='Escape'){closeStory();}
    else if(e.key==='Tab'){trap(e,stage);}
  } else if(sheet.classList.contains('on')){
    if(e.key==='Escape')closeSheet(); else if(e.key==='Tab')trap(e,sheet);
  }
});
function trap(e,root){const f=[...root.querySelectorAll('button:not([hidden]):not([tabindex="-1"]),a[href]')];if(!f.length)return;const a=f[0],z=f[f.length-1];
  if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}
// pause on press-and-hold
let held=false;
stage.addEventListener('pointerdown',e=>{if(e.target.closest('.tapzone')){held=true;cancelAnimationFrame(raf);}});
stage.addEventListener('pointerup',()=>{held=false;});
</script>
</body>
</html>
